[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "release-call-cost-diagnostics"
version = "0.1.0"
description = "Gate a developer release operation with observable per-call model cost."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.0,<3",
  "pydantic>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["cost_receipt", "release_diagnostics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
